services:
  postgres:
    image: postgres:16
    container_name: codearcade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codearcade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codearcade}
      POSTGRES_DB: ${POSTGRES_DB:-codearcade}
    volumes:
      - codearcade_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codearcade}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: codearcade-api
    restart: unless-stopped
    ports:
      # The host TLS proxy reaches the API locally; this is never publicly exposed.
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codearcade}:${POSTGRES_PASSWORD:-codearcade}@postgres:5432/${POSTGRES_DB:-codearcade}
      JWT_SECRET: ${JWT_SECRET:-change-me-use-openssl-rand-hex-32}
      INTERNAL_JUDGE_TOKEN: ${INTERNAL_JUDGE_TOKEN:-change-me-use-openssl-rand-hex-32}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PORT: 4000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@codearcade.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      GLOBAL_RATE_LIMIT: 300
      AUTH_RATE_LIMIT: 20
      SUBMISSION_RATE_LIMIT: 10
      JUDGE_STALE_THRESHOLD_MS: 60000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: codearcade-web
    restart: unless-stopped
    ports:
      # The host TLS proxy reaches Next.js locally; this is never publicly exposed.
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api
    environment:
      # Next standalone prefers HOSTNAME when present. Docker otherwise injects
      # the container ID, which prevents the localhost health check from connecting.
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  judge:
    build:
      context: .
      dockerfile: judge-core/Dockerfile
    container_name: codearcade-judge
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:4000
      INTERNAL_JUDGE_TOKEN: ${INTERNAL_JUDGE_TOKEN:-change-me-use-openssl-rand-hex-32}
      CODEARCADE_ENV: ${CODEARCADE_ENV:-production}
      JUDGE_EXECUTION_MODE: ${JUDGE_EXECUTION_MODE:-docker}
      JUDGE_WORKSPACE_ROOT: /app/workspaces
      JUDGE_DOCKER_WORKSPACE_ROOT: ${JUDGE_DOCKER_WORKSPACE_ROOT:-${PWD}/judge-workspaces}
    volumes:
      - ${JUDGE_DOCKER_WORKSPACE_ROOT:-${PWD}/judge-workspaces}:/app/workspaces
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:1.27-alpine
    container_name: codearcade-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      # Avoid conflicting with the host Nginx service that terminates TLS.
      - "127.0.0.1:${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  codearcade_pg:
